<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7X assistant — customer</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
/* ============================================================ layout
   Three columns. The phone is a faithful WhatsApp, because a half-hearted
   imitation reads as neither real nor deliberate. The live record sits OUTSIDE
   it: WhatsApp has no such panel, so putting it inside broke the illusion, and
   it is also the proof that the database is the truth -- which deserves its own
   space rather than being squeezed into a chat window.                        */
body { display: grid; grid-template-columns: 250px 1fr; height: 100vh; overflow: hidden; }
@media (max-width: 900px) { body { grid-template-columns: 1fr; } aside { display: none; } }

/* ============================================================ sidebar */
aside { background: var(--surface); border-right: 1px solid var(--line);
        display: flex; flex-direction: column; min-height: 0; }
.side-top { padding: 14px 13px 11px; border-bottom: 1px solid var(--line); }
.brand-row { display: flex; align-items: baseline; gap: 7px; margin-bottom: 11px; }
.brand-row .mark { font-size: 19px; font-weight: 800; color: var(--brand); letter-spacing: -.04em; }
.brand-row .mark span { color: var(--accent); }
.brand-row .sub { font-size: 11px; color: var(--text-faint); letter-spacing: .02em; }

.sessions { flex: 1; overflow-y: auto; padding: 7px; min-height: 0; }
.sess { padding: 9px 10px; border-radius: var(--radius-sm); cursor: pointer;
        border: 1px solid transparent; margin-bottom: 2px; }
.sess:hover { background: var(--surface-2); }
.sess.on { background: var(--brand-soft); border-color: var(--brand); }
.sess-head { display: flex; align-items: center; gap: 6px; }
.sess-name { font-size: 13px; font-weight: 600; flex: 1; overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap; }
.sess-prev { font-size: 11px; color: var(--text-faint); margin-top: 2px; overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap; }
.ch { font-size: 9.5px; padding: 1px 5px; border-radius: 100px; font-weight: 700; letter-spacing: .04em; }
.ch-whatsapp { background: #25d36626; color: #0f8a47; }
.ch-web { background: var(--brand-soft); color: var(--brand); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) .ch-whatsapp { color: #6ee7a6; }
}
.badge-case { background: var(--blocked-bg); color: var(--blocked); font-size: 9.5px;
              font-weight: 700; padding: 1px 5px; border-radius: 100px; }
.side-foot { padding: 9px 11px; border-top: 1px solid var(--line); display: flex; gap: 6px; }
.side-foot > * { flex: 1; font-size: 11.5px; padding: 6px 7px; text-align: center;
                 text-decoration: none; }

/* ============================================================ stage */
main { min-height: 0; overflow: auto; padding: 16px;
       display: flex; gap: 16px; align-items: flex-start; justify-content: center; }
.empty { margin: auto; text-align: center; color: var(--text-faint); max-width: 330px; }
.empty h2 { color: var(--text); font-size: 17px; font-weight: 650; margin: 0 0 7px; }
.empty p { font-size: 13.5px; line-height: 1.6; margin: 0 0 16px; }

/* ============================================================ the phone */
.phone {
  width: 372px; flex: 0 0 372px;
  height: min(760px, calc(100vh - 32px));
  border-radius: 40px; padding: 10px;
  background: linear-gradient(160deg, #3a4048, #16191d 40%, #23272d);
  box-shadow: var(--shadow-lg), inset 0 0 0 1px rgba(255,255,255,.07);
  display: flex; flex-direction: column;
}
.screen { flex: 1; border-radius: 31px; overflow: hidden;
          display: flex; flex-direction: column; min-height: 0; background: var(--wa-bg); }

/* --- ios status bar; small thing, big realism payoff */
.statusbar { display: flex; align-items: center; padding: 7px 22px 3px;
             background: var(--wa-header); color: var(--wa-header-tx);
             font-size: 12px; font-weight: 650; letter-spacing: .01em; }
.statusbar .t { flex: 1; }
.statusbar .icons { display: flex; align-items: center; gap: 4px; opacity: .85; }
.bat { width: 20px; height: 10px; border: 1.2px solid currentColor; border-radius: 3px;
       position: relative; }
.bat::after { content: ""; position: absolute; inset: 1.5px; right: 5px;
              background: currentColor; border-radius: 1px; }
.bat::before { content: ""; position: absolute; right: -3px; top: 3px; width: 1.6px;
               height: 4px; background: currentColor; border-radius: 0 1px 1px 0; }

/* --- whatsapp header: shows WHO YOU ARE TALKING TO, never your own number */
.wahead { display: flex; align-items: center; gap: 9px; padding: 6px 12px 9px;
          background: var(--wa-header); color: var(--wa-header-tx); }
.back { font-size: 19px; opacity: .8; line-height: 1; margin-right: -2px; }
.wavatar { width: 37px; height: 37px; border-radius: 50%; flex-shrink: 0;
           background: linear-gradient(145deg, var(--brand-2), var(--brand));
           color: #fff; display: grid; place-items: center;
           font-size: 13px; font-weight: 800; letter-spacing: -.04em; }
.waname { flex: 1; min-width: 0; }
.waname b { display: block; font-size: 15px; font-weight: 600; line-height: 1.25;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.waname small { font-size: 11.5px; color: var(--wa-meta); }
.waicons { display: flex; gap: 15px; font-size: 16px; opacity: .72; }

/* --- message area */
.msgs { flex: 1; overflow-y: auto; padding: 8px 8px 10px; min-height: 0;
        background-color: var(--wa-bg);
        background-image:
          radial-gradient(circle at 11% 19%, rgba(0,0,0,.04) 0 2px, transparent 2px),
          radial-gradient(circle at 61% 57%, rgba(0,0,0,.04) 0 2px, transparent 2px),
          radial-gradient(circle at 86% 11%, rgba(0,0,0,.035) 0 3px, transparent 3px),
          radial-gradient(circle at 33% 82%, rgba(0,0,0,.035) 0 2px, transparent 2px),
          radial-gradient(circle at 47% 34%, rgba(0,0,0,.03) 0 2px, transparent 2px);
        background-size: 200px 200px; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) .msgs { background-image:
    radial-gradient(circle at 11% 19%, rgba(255,255,255,.028) 0 2px, transparent 2px),
    radial-gradient(circle at 61% 57%, rgba(255,255,255,.028) 0 2px, transparent 2px),
    radial-gradient(circle at 86% 11%, rgba(255,255,255,.022) 0 3px, transparent 3px),
    radial-gradient(circle at 33% 82%, rgba(255,255,255,.022) 0 2px, transparent 2px),
    radial-gradient(circle at 47% 34%, rgba(255,255,255,.02) 0 2px, transparent 2px); }
}

.sysline { text-align: center; margin: 9px 14px; }
.sysline span { display: inline-block; padding: 5px 11px; border-radius: 7px;
  background: #ffeecc; color: #6a5624; font-size: 11px; line-height: 1.45; }
.sysline.day span { background: rgba(255,255,255,.75); color: var(--wa-meta);
  font-weight: 600; font-size: 11px; letter-spacing: .03em; text-transform: uppercase; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) .sysline span { background: #182a2e; color: #d5c391; }
  :root:not([data-theme=light]) .sysline.day span { background: #182229; color: var(--wa-meta); }
}

.msg { display: flex; margin-bottom: 3px; padding: 0 4px; animation: pop .2s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(5px); } }
.msg.out { justify-content: flex-end; }
.msg + .msg.out:not(.same), .msg + .msg.in:not(.same) { margin-top: 8px; }

.bub { position: relative; max-width: 78%; padding: 6px 9px 4px 9px; border-radius: 8px;
       font-size: 14.2px; line-height: 1.42; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
.msg.in  .bub { background: var(--wa-in);  border-top-left-radius: 2px; }
.msg.out .bub { background: var(--wa-out); border-top-right-radius: 2px; }
.msg.same .bub { border-radius: 8px !important; }
/* the little tail */
.msg:not(.same) .bub::before { content: ""; position: absolute; top: 0; width: 9px; height: 11px; }
.msg.in:not(.same)  .bub::before { left: -8px;
  background: radial-gradient(circle at 100% 0, transparent 9px, var(--wa-in) 9px); }
.msg.out:not(.same) .bub::before { right: -8px;
  background: radial-gradient(circle at 0 0, transparent 9px, var(--wa-out) 9px); }

.txt { white-space: pre-wrap; word-wrap: break-word; }
.txt[dir=rtl] { text-align: right; }
.meta { float: right; margin: 6px 0 -2px 8px; font-size: 10.5px; color: var(--wa-meta);
        display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.tick { color: var(--wa-tick); font-size: 12px; line-height: 1; }

.staff-tag { display: block; font-size: 11.5px; font-weight: 700; color: var(--accent);
             margin-bottom: 1px; }

.typing { display: inline-flex; gap: 3px; padding: 4px 2px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--wa-meta);
            animation: blink 1.25s infinite; }
.typing i:nth-child(2) { animation-delay: .17s; }
.typing i:nth-child(3) { animation-delay: .34s; }
@keyframes blink { 0%,60%,100% { opacity: .25 } 30% { opacity: 1 } }

/* --- quick replies. A real WhatsApp Business feature, so it stays authentic
   while keeping "a person is one tap away" visible from message one. */
.quick { display: flex; gap: 6px; padding: 7px 9px 3px; flex-wrap: wrap;
         background: var(--wa-bg); justify-content: flex-end; }
.chip { background: var(--wa-in); color: var(--brand-2); border: none;
        padding: 6px 12px; border-radius: 100px; font-size: 12.5px; font-weight: 550;
        box-shadow: 0 1px .5px rgba(11,20,26,.13); }
.chip:hover { filter: brightness(.97); }
.chip.human { color: var(--accent); font-weight: 650; }

/* --- composer */
.composer { display: flex; align-items: flex-end; gap: 7px; padding: 7px 8px 9px;
            background: var(--wa-composer); }
.cbox { flex: 1; display: flex; align-items: flex-end; gap: 7px; background: var(--wa-in);
        border-radius: 22px; padding: 7px 11px; }
.cbox .ic { font-size: 16px; opacity: .55; line-height: 1.4; }
.cbox textarea { flex: 1; border: none; outline: none; resize: none; background: transparent;
                 color: var(--text); font-size: 14.5px; line-height: 1.4; max-height: 84px; }
.mic { width: 40px; height: 40px; border-radius: 50%; border: none; flex-shrink: 0;
       background: var(--wa-header-tx); color: var(--wa-header); font-size: 16px;
       display: grid; place-items: center; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) .mic { background: #00a884; color: #fff; }
}
.mic:disabled { opacity: .45; }

/* ============================================================ web channel frame */
.browser { width: min(560px, 100%); flex: 0 0 auto; height: min(760px, calc(100vh - 32px));
           border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden;
           background: var(--surface); box-shadow: var(--shadow-lg);
           display: flex; flex-direction: column; }
.urlbar { display: flex; align-items: center; gap: 9px; padding: 9px 12px;
          background: var(--surface-2); border-bottom: 1px solid var(--line); }
.dots { display: flex; gap: 5px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line-strong); }
.urlbar .u { flex: 1; font-size: 11.5px; color: var(--text-faint); background: var(--surface);
             border: 1px solid var(--line); padding: 4px 10px; border-radius: 100px; }
.webhead { display: flex; align-items: center; gap: 10px; padding: 12px 14px;
           background: var(--brand); color: var(--brand-ink); }
.webhead .m { font-size: 17px; font-weight: 800; letter-spacing: -.04em; }
.webhead .m span { color: var(--accent); }
.webhead .t { flex: 1; font-size: 13px; opacity: .9; }
.browser .msgs { background: var(--surface-2); background-image: none; }
.browser .msg.in .bub { background: var(--surface); border: 1px solid var(--line); }
.browser .msg.out .bub { background: var(--brand); color: #fff; }
.browser .msg.out .meta { color: rgba(255,255,255,.7); }
.browser .quick { background: var(--surface-2); }
.browser .chip { background: var(--surface); border: 1px solid var(--line); }
.browser .composer { background: var(--surface); border-top: 1px solid var(--line); }
.browser .cbox { background: var(--surface-2); border: 1px solid var(--line); }
.browser .mic { background: var(--brand); color: #fff; }

/* ============================================================ live record panel */
.record { width: 306px; flex: 0 0 306px; background: var(--surface);
          border: 1px solid var(--line); border-radius: var(--radius);
          box-shadow: var(--shadow); overflow: hidden; }
@media (max-width: 1180px) { .record { display: none; } }
.rec-head { padding: 12px 14px 11px; border-bottom: 1px solid var(--line); }
.rec-head h3 { margin: 0 0 3px; font-size: 13px; font-weight: 650; letter-spacing: -.01em; }
.rec-head p { margin: 0; font-size: 11.5px; color: var(--text-faint); line-height: 1.5; }
.rec-body { padding: 13px 14px 15px; }
.rec-tn { font-family: var(--mono); font-size: 14px; font-weight: 650; letter-spacing: -.02em;
          margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.kv { display: grid; grid-template-columns: 74px 1fr; gap: 3px 10px; font-size: 12.5px;
      line-height: 1.5; margin-bottom: 11px; }
.kv dt { color: var(--text-faint); }
.kv dd { margin: 0; font-weight: 550; word-break: break-word; }
.kv dd.changed { animation: flash 1.6s ease-out; border-radius: 4px; }
@keyframes flash {
  0%, 30% { background: var(--ok-bg); box-shadow: 0 0 0 4px var(--ok-bg); color: var(--ok); }
  100%    { background: transparent; box-shadow: none; }
}
.rec-flags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 11px; }
.rec-foot { font-size: 10.5px; color: var(--text-faint); border-top: 1px dashed var(--line);
            padding-top: 9px; line-height: 1.6; }
.rec-empty { padding: 26px 14px; text-align: center; color: var(--text-faint); font-size: 12.5px;
             line-height: 1.6; }

/* ============================================================ verify (web) */
.verify { padding: 22px 20px; flex: 1; overflow-y: auto; background: var(--surface-2); }
.verify h3 { font-size: 16px; font-weight: 650; margin: 0 0 6px; letter-spacing: -.01em; }
.verify p { font-size: 13px; color: var(--text-soft); line-height: 1.6; margin: 0 0 14px; }
.field { display: flex; gap: 7px; margin-bottom: 12px; }
.field input { flex: 1; padding: 10px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--text);
  font-family: var(--mono); letter-spacing: .05em; outline: none; }
.field input:focus { border-color: var(--brand); }
.steps { display: flex; gap: 5px; margin-bottom: 18px; }
.steps i { height: 3px; flex: 1; border-radius: 2px; background: var(--line); }
.steps i.on { background: var(--brand); }
.err { color: var(--blocked); font-size: 12.5px; margin: -6px 0 12px; }

/* ============================================================ modal */
.scrim { position: fixed; inset: 0; background: rgba(6,10,16,.5); backdrop-filter: blur(2px);
         display: grid; place-items: center; padding: 20px; z-index: 50; animation: pop .15s; }
.modal { background: var(--surface); border-radius: var(--radius); width: 100%; max-width: 470px;
         box-shadow: var(--shadow-lg); overflow: hidden; max-height: 86vh;
         display: flex; flex-direction: column; }
.modal header { padding: 16px 18px 13px; border-bottom: 1px solid var(--line); }
.modal header h3 { margin: 0 0 3px; font-size: 16px; font-weight: 650; }
.modal header p { margin: 0; font-size: 12.5px; color: var(--text-soft); }
.modal .body { padding: 14px 18px 18px; overflow-y: auto; }
.chan { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 15px; }
.chan button { padding: 12px 11px; text-align: left; }
.chan button.on { border-color: var(--brand); background: var(--brand-soft); }
.chan b { display: block; font-size: 13.5px; margin-bottom: 2px; }
.chan small { font-size: 11.5px; color: var(--text-soft); font-weight: 400; }
.persona { width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 6px; }
.persona b { display: block; font-size: 13.5px; }
.persona small { font-size: 11.5px; color: var(--text-soft); }
.persona .mono { font-size: 10.5px; color: var(--text-faint); }
</style>
</head>
<body>

<aside>
  <div class="side-top">
    <div class="brand-row"><span class="mark">7<span>X</span></span><span class="sub">assistant</span></div>
    <button class="btn btn-primary" style="width:100%" onclick="openNew()">New conversation</button>
  </div>
  <div class="sessions" id="sessions"></div>
  <div class="side-foot">
    <a class="btn btn-ghost" href="/ops">Operations</a>
    <button class="btn btn-ghost" onclick="resetAll()">Reset</button>
  </div>
</aside>

<main id="stage"></main>

<script>
const $ = s => document.querySelector(s);
let sessions = [], current = null, sending = false, lastRecord = null;

const AR   = /[؀-ۿ]/;
const dir  = t => AR.test(t || "") ? "rtl" : "ltr";
const esc  = t => (t || "").replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
const hhmm = at => { const d = at ? new Date(at) : new Date();
  return isNaN(d) ? "" : d.toTimeString().slice(0, 5); };

const api = async (p, o) => {
  const r = await fetch(p, { headers: { "Content-Type": "application/json" }, ...o });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
};

/* ------------------------------------------------------------ sidebar */
async function loadSessions() {
  sessions = await api("/api/sessions");
  $("#sessions").innerHTML = sessions.map(s => `<div class="sess ${current===s.id?"on":""}" onclick="openSession('${s.id}')"><div class="sess-head"><span class="sess-name">${esc(s.customer_name||"Not verified")}</span>${s.open_cases?`<span class="badge-case">${s.open_cases}</span>`:""}<span class="ch ch-${s.channel}">${s.channel==="whatsapp"?"WA":"WEB"}</span></div><div class="sess-prev">${esc(s.preview)||"&nbsp;"}</div></div>`).join("")
    || `<p style="padding:13px;font-size:12px;color:var(--text-faint)">No conversations yet.</p>`;
}

/* ------------------------------------------------------------ new chat */
let pickedChannel = "whatsapp";
async function openNew() {
  const people = await api("/api/demo/customers");
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.onclick = e => { if (e.target === scrim) scrim.remove(); };
  scrim.innerHTML = `<div class="modal"><header><h3>New conversation</h3><p>The channel decides how the customer proves who they are.</p></header><div class="body"><div class="chan"><button class="btn on" data-c="whatsapp"><b>WhatsApp</b><small>Number already verified. 0 steps.</small></button><button class="btn" data-c="web"><b>Website</b><small>Tracking number, then a code. 4 steps.</small></button></div><div id="pane"></div></div></div>`;
  document.body.appendChild(scrim);

  const pane = scrim.querySelector("#pane");
  const paint = () => {
    scrim.querySelectorAll(".chan .btn").forEach(b => b.classList.toggle("on", b.dataset.c === pickedChannel));
    pane.innerHTML = pickedChannel === "whatsapp"
      ? `<p style="font-size:12.5px;color:var(--text-soft);margin:0 0 9px">Pick who is messaging. Each is a real row from the cleaned file, chosen because it exercises a different part of the system.</p>`
        + people.map((p, i) => `<button class="btn persona" data-i="${i}"><b>${esc(p.customer_name||"No name on file")}</b><small>${esc(p.label)}</small><br><span class="mono">${esc(p.masked_phone||"no phone on file")}</span></button>`).join("")
      : `<p style="font-size:12.5px;color:var(--text-soft);margin:0 0 9px">The website knows nothing about who you are. It asks for a tracking number, then sends a code to the phone already on that record.</p><button class="btn btn-primary" style="width:100%" id="startweb">Start on the website</button>`;

    pane.querySelectorAll(".persona").forEach(b => b.onclick = async () => {
      const p = people[+b.dataset.i]; scrim.remove();
      const s = await api("/api/sessions", { method: "POST", body: JSON.stringify({ channel: "whatsapp", phone: p.phone }) });
      await loadSessions(); openSession(s.id);
    });
    const sw = pane.querySelector("#startweb");
    if (sw) sw.onclick = async () => {
      scrim.remove();
      const s = await api("/api/sessions", { method: "POST", body: JSON.stringify({ channel: "web" }) });
      await loadSessions(); openSession(s.id);
    };
  };
  scrim.querySelectorAll(".chan .btn").forEach(b => b.onclick = () => { pickedChannel = b.dataset.c; paint(); });
  paint();
}

/* ------------------------------------------------------------ render */
async function openSession(id) {
  if (id !== current) lastRecord = null;
  current = id;
  render(await api("/api/sessions/" + id));
  loadSessions();
}

function render(d) {
  const s = d.session, wa = s.channel === "whatsapp";
  const needsVerify = s.channel === "web" && !s.verified;
  $("#stage").innerHTML = (wa ? phoneFrame(s, d, needsVerify) : browserFrame(s, d, needsVerify))
                        + recordPanel(d.shipment, s);
  if (needsVerify) wireVerify(s.id); else { wireChat(); scrollDown(); }
  lastRecord = d.shipment;
}

function phoneFrame(s, d, needsVerify) {
  return `<div class="phone"><div class="screen">
    <div class="statusbar"><span class="t">${hhmm()}</span>
      <span class="icons">▪▪▪ <span style="letter-spacing:-1px">◗</span> <span class="bat"></span></span></div>
    <div class="wahead">
      <span class="back">‹</span>
      <div class="wavatar">7X</div>
      <div class="waname"><b>7X</b><small id="presence">business account</small></div>
      <div class="waicons"><span>⤻</span><span>✆</span><span>⋮</span></div>
    </div>
    ${needsVerify ? verifyPane() : body(d)}
  </div></div>`;
}

function browserFrame(s, d, needsVerify) {
  return `<div class="browser">
    <div class="urlbar"><div class="dots"><i></i><i></i><i></i></div><div class="u">7x.ae/track</div></div>
    <div class="webhead"><span class="m">7<span>X</span></span>
      <span class="t">${s.verified ? "Verified · " + esc(s.masked_phone) : "Track your shipment"}</span></div>
    ${needsVerify ? verifyPane() : body(d)}
  </div>`;
}

function body(d) {
  return `<div class="msgs" id="msgs">${thread(d.messages)}</div>
    <div class="quick" id="quick">
      <button class="chip" data-q="Where is my parcel?">Where is it?</button>
      <button class="chip" data-q="I need to change the delivery date">Change the date</button>
      <button class="chip human" data-q="I'd like to speak to a person please">Talk to a person</button>
    </div>
    <div class="composer">
      <div class="cbox"><span class="ic">☺</span>
        <textarea id="input" rows="1" placeholder="Message"></textarea>
        <span class="ic">🖇</span><span class="ic">⌾</span></div>
      <button class="mic" id="send">➤</button>
    </div>`;
}

/* ------------------------------------------------------------ messages */
function thread(ms) {
  let html = `<div class="sysline"><span>🔒 Messages are end-to-end encrypted. This is a simulated channel for a prototype.</span></div>`;
  html += `<div class="sysline day"><span>Today</span></div>`;
  let prev = null;
  for (const m of ms) {
    if (m.role === "notice") { html += `<div class="sysline"><span>${esc(m.text)}</span></div>`; prev = null; continue; }
    html += bubble(m, prev && prev.role === m.role);
    prev = m;
  }
  return html;
}

function bubble(m, same) {
  const out = m.role === "customer";
  // NOTE: no line breaks inside .txt -- it is `white-space: pre-wrap`, and a prettily
  // indented template literal leaks its indentation into every single message.
  const tag = m.role === "staff" ? `<span class="staff-tag">${esc(m.author || "7X team")}</span>` : "";
  const tick = out ? `<span class="tick">✓✓</span>` : "";
  return `<div class="msg ${out ? "out" : "in"} ${same ? "same" : ""}"><div class="bub">${tag}<span class="txt" dir="${dir(m.text)}">${esc(m.text)}</span><span class="meta">${hhmm(m.at)}${tick}</span></div></div>`;
}

/* ------------------------------------------------------------ live record */
function recordPanel(sh, s) {
  if (!sh) return `<div class="record"><div class="rec-head"><h3>The shipment record</h3><p>Read straight from the database.</p></div><div class="rec-empty">No parcel in focus yet.<br>It appears here as soon as the assistant looks one up.</div></div>`;

  const chg = k => lastRecord && lastRecord.tracking_number === sh.tracking_number
                && String(lastRecord[k]) !== String(sh[k]) ? "changed" : "";
  const flags = [];
  if (sh.unclear)  flags.push(`<span class="pill pill-suspect">records disagree</span>`);
  if (sh.cod > 0)  flags.push(`<span class="pill pill-blocked">COD, address locked</span>`);
  if (sh.attempts !== null && sh.attempts >= sh.max_attempts)
                   flags.push(`<span class="pill pill-blocked">attempt limit</span>`);
  if (!s.verified) flags.push(`<span class="pill pill-blocked">not verified</span>`);

  return `<div class="record">
    <div class="rec-head"><h3>The shipment record</h3>
      <p>Read straight from the database on every turn, never from what the assistant said.</p></div>
    <div class="rec-body">
      <div class="rec-tn">${esc(sh.tracking_number)}
        ${sh.unclear ? `<span class="pill pill-suspect">unclear</span>`
                     : `<span class="pill pill-quiet ${chg("status")}">${esc(sh.status.replace(/_/g," "))}</span>`}</div>
      <dl class="kv">
        <dt>Going to</dt><dd class="${chg("address")}" dir="${dir(sh.address)}">${esc(sh.address||"no address on file")}</dd>
        <dt>Date</dt><dd class="${chg("scheduled_date")}">${esc(sh.scheduled_date||"not scheduled")}</dd>
        <dt>Emirate</dt><dd>${esc(sh.emirate||"—")}</dd>
        <dt>To collect</dt><dd>${sh.cod > 0 ? sh.cod.toFixed(2)+" AED" : "nothing"}</dd>
        <dt>Attempts</dt><dd>${sh.attempts === null ? "unknown" : sh.attempts+" of "+sh.max_attempts}</dd>
      </dl>
      ${flags.length ? `<div class="rec-flags">${flags.join("")}</div>` : ""}
      <div class="rec-foot">Last written ${esc(sh.updated_at || "—")}.<br>
        If the assistant claims something this panel does not show, the panel is right.</div>
    </div></div>`;
}

/* ------------------------------------------------------------ verify */
function verifyPane() {
  return `<div class="verify" id="vp"><div class="steps"><i class="on"></i><i></i><i></i><i></i></div>
    <h3>Track a parcel</h3><p>Enter the tracking number from your parcel or your delivery message.</p>
    <div class="field"><input id="vtn" placeholder="EX400312AE" autocomplete="off">
      <button class="btn btn-primary" id="vgo">Find</button></div><div id="verr"></div></div>`;
}

function wireVerify(sid) {
  const step2 = r => {
    $("#vp").innerHTML = `<div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
      <h3>Confirm it's you</h3>
      <p>A code was sent to the number already on this shipment (<span class="mono">${esc(r.masked_phone)}</span>). It goes to the number on the record, never to one you type, so someone holding the parcel cannot get in.</p>
      <div class="demo-strip" style="margin-bottom:14px">DEMO MODE · no SMS is really sent · your code is ${esc(r.demo_code)}</div>
      <div class="field"><input id="vcode" placeholder="4 digits" maxlength="4" autocomplete="off">
        <button class="btn btn-primary" id="vconfirm">Verify</button></div><div id="verr"></div>`;
    const go = async () => {
      const res = await api(`/api/sessions/${sid}/verify/confirm`, { method: "POST", body: JSON.stringify({ code: $("#vcode").value }) });
      if (!res.verified) { $("#verr").innerHTML = `<div class="err">${esc(res.reason)}</div>`; return; }
      openSession(sid);
    };
    $("#vconfirm").onclick = go;
    $("#vcode").onkeydown = e => { if (e.key === "Enter") go(); };
    $("#vcode").focus();
  };
  const find = async () => {
    const tn = $("#vtn").value.trim(); if (!tn) return;
    try {
      const r = await api(`/api/sessions/${sid}/verify/start`, { method: "POST", body: JSON.stringify({ tracking_number: tn }) });
      if (!r.can_verify) {
        $("#vp").innerHTML = `<div class="steps"><i class="on"></i><i class="on"></i><i></i><i></i></div>
          <h3>We can show you where it is</h3><p>${esc(r.reason)}</p>
          <p>You can still see its status. To change anything, our team can verify you another way.</p>
          <button class="btn btn-primary" style="width:100%" onclick="openSession('${sid}')">See the status</button>`;
        return;
      }
      step2(r);
    } catch (e) { $("#verr").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };
  $("#vgo").onclick = find;
  $("#vtn").onkeydown = e => { if (e.key === "Enter") find(); };
  $("#vtn").focus();
}

/* ------------------------------------------------------------ talking */
function wireChat() {
  const input = $("#input");
  input.oninput = () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 84) + "px"; };
  input.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); say(input.value); } };
  $("#send").onclick = () => say(input.value);
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => say(c.dataset.q));
  input.focus();
}

async function say(text) {
  text = (text || "").trim();
  if (!text || sending) return;
  sending = true;
  $("#input").value = ""; $("#input").style.height = "auto"; $("#send").disabled = true;
  const pres = $("#presence"); if (pres) pres.textContent = "typing…";

  $("#msgs").insertAdjacentHTML("beforeend",
    bubble({ role: "customer", text, at: null }, false) +
    `<div class="msg in" id="typing"><div class="bub"><span class="typing"><i></i><i></i><i></i></span></div></div>`);
  scrollDown();

  try {
    await api(`/api/sessions/${current}/message`, { method: "POST", body: JSON.stringify({ text }) });
    render(await api("/api/sessions/" + current));
  } catch (e) {
    document.getElementById("typing")?.remove();
    $("#msgs").insertAdjacentHTML("beforeend", `<div class="sysline"><span>${esc(e.message)}</span></div>`);
  } finally {
    sending = false; scrollDown(); loadSessions();
  }
}

const scrollDown = () => { const m = $("#msgs"); if (m) m.scrollTop = m.scrollHeight; };

/* ------------------------------------------------------------ misc */
async function resetAll() {
  if (!confirm("Reset the demo? This restores the shipment data and clears every conversation.")) return;
  await api("/api/reset", { method: "POST" });
  current = null; lastRecord = null;
  await loadSessions(); showEmpty();
}

function showEmpty() {
  $("#stage").innerHTML = `<div class="empty"><h2>No conversation open</h2>
    <p>Start one and pick a channel. WhatsApp arrives already verified. The website has to ask.</p>
    <button class="btn btn-primary" onclick="openNew()">New conversation</button></div>`;
}

(async () => { await loadSessions(); showEmpty(); })();
</script>
</body>
</html>
