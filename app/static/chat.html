<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7X assistant — customer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%22-4%20-8%2064%2048%22%3E%3Crect%20x%3D%22-4%22%20y%3D%22-8%22%20width%3D%2264%22%20height%3D%2248%22%20rx%3D%229%22%20fill%3D%22%25231428ff%22%2F%3E%3Cg%20fill%3D%22%2523ffffff%22%3E%3Cg%20transform%3D%22skewX%28-11%29%22%3E%3Cpolygon%20points%3D%222%2C0%2027%2C0%2015%2C32%206%2C32%2017%2C7%202%2C7%22%2F%3E%3Cpolygon%20points%3D%2230%2C0%2038%2C0%2054%2C32%2046%2C32%22%2F%3E%3Cpolygon%20points%3D%2246%2C0%2054%2C0%2038%2C32%2030%2C32%22%2F%3E%3C%2Fg%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<meta name="theme-color" content="#070a17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,600;0,700;0,800;1,800&family=IBM+Plex+Sans:wght@400..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400..700&display=swap">
<link rel="stylesheet" href="/static/theme.css">
<style>
/* ============================================================ layout
   Three columns. The phone is a faithful WhatsApp, because a half-hearted
   imitation reads as neither real nor deliberate. The live record sits OUTSIDE
   it: WhatsApp has no such panel, so putting it inside broke the illusion, and
   it is also the proof that the database is the truth -- which deserves its own
   space rather than being squeezed into a chat window.                        */
body { display: grid; grid-template-columns: 250px 1fr; height: 100vh; overflow: hidden; }
@media (max-width: 900px) { body { grid-template-columns: 1fr; } aside { display: none; } }

/* ============================================================ sidebar */
aside { background: var(--surface); border-right: 1px solid var(--line);
        display: flex; flex-direction: column; min-height: 0; }

.side-top { padding: 16px 14px 13px; }
.brand-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.brand-row { text-decoration: none; }
.brand-row .mark svg { display: block; height: 18px; width: auto; color: var(--text); }
.brand-row .bar { width: 1px; height: 15px; background: var(--line-strong); }
.brand-row .sub { font-size: 12.5px; color: var(--text-soft); font-weight: 560;
                  letter-spacing: -.01em; }
.side-top .btn { width: 100%; display: flex; align-items: center; justify-content: center;
                 gap: 7px; padding: 10px; font-weight: 600; }

.sec { display: flex; align-items: center; gap: 7px; padding: 4px 16px 7px; }
.sec span { font-size: 10.5px; font-weight: 700; letter-spacing: .09em;
            text-transform: uppercase; color: var(--text-faint); }
.sec b { margin-left: auto; font-size: 10.5px; font-weight: 700; color: var(--text-faint); }

.sessions { flex: 1; overflow-y: auto; padding: 0 8px 8px; min-height: 0; }
.sess { position: relative; display: flex; gap: 10px; align-items: center; padding: 9px 9px;
        border-radius: 10px; cursor: pointer; margin-bottom: 2px;
        border: 1px solid transparent; transition: background .1s; }
.sess:hover { background: var(--surface-2); }
.sess.on { background: var(--brand-soft); }
.sess.on::before { content: ""; position: absolute; left: 0; width: 3px; height: 26px;
                   border-radius: 0 3px 3px 0; background: var(--brand); margin-left: -9px; }
/* Identity tones from theme.css, the same six as the console, so one person is
   one colour on both surfaces and in both themes. */
.av { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; display: grid;
      place-items: center; font-size: 11.5px; font-weight: 700;
      letter-spacing: -.02em; }
.av.t0 { background: var(--tone-0); color: var(--tone-0-ink); }
.av.t1 { background: var(--tone-1); color: var(--tone-1-ink); }
.av.t2 { background: var(--tone-2); color: var(--tone-2-ink); }
.av.t3 { background: var(--tone-3); color: var(--tone-3-ink); }
.av.t4 { background: var(--tone-4); color: var(--tone-4-ink); }
.av.t5 { background: var(--tone-5); color: var(--tone-5-ink); }
.av.none { background: var(--surface-3); color: var(--text-faint); font-size: 14px; }
.sess-mid { flex: 1; min-width: 0; }
.sess-name { font-size: 13.2px; font-weight: 620; overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap; letter-spacing: -.01em; }
.sess-prev { font-size: 11.5px; color: var(--text-faint); margin-top: 1px; overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap; }
.sess-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
              flex-shrink: 0; }
.ch { font-size: 9px; padding: 2px 6px; border-radius: 100px; font-weight: 750;
      letter-spacing: .05em; }
.ch-whatsapp { background: #25d3661f; color: #16a34a; }
.ch-web { background: var(--brand-soft); color: var(--brand); }
.badge-case { background: var(--blocked); color: #fff; font-size: 9.5px; font-weight: 750;
              min-width: 17px; height: 17px; padding: 0 5px; border-radius: 100px;
              display: grid; place-items: center; }
.sess-empty { padding: 22px 16px; font-size: 12px; color: var(--text-faint);
              line-height: 1.6; text-align: center; }

.side-foot { border-top: 1px solid var(--line); padding: 9px 8px; }
.navitem { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 9px;
           border: none; background: transparent; color: var(--text-soft);
           border-radius: 9px; font-size: 12.8px; font-weight: 550; text-decoration: none;
           text-align: left; }
.navitem:hover { background: var(--surface-2); color: var(--text); }
.navitem .g { width: 17px; text-align: center; opacity: .8; font-size: 13px; }
.navitem .k { margin-left: auto; font-size: 10px; color: var(--text-faint);
              border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
.clock { padding: 8px 9px 2px; font-size: 11.5px; color: var(--text-faint); }

/* ============================================================ stage */
main { min-height: 0; overflow: auto; padding: 16px;
       display: flex; gap: 16px; align-items: flex-start; justify-content: center; }
.empty { margin: auto; text-align: center; color: var(--text-faint); max-width: 330px; }
.empty h2 { color: var(--text); font-size: 17px; font-weight: 650; margin: 0 0 7px; }
.empty p { font-size: 13.5px; line-height: 1.6; margin: 0 0 16px; }

/* ============================================================ the phone */
.phone {
  position: relative;
  width: 378px; flex: 0 0 378px;
  height: min(786px, calc(100vh - 32px));
  border-radius: 54px; padding: 11px;
  background: linear-gradient(155deg, #55595f 0%, #16181c 16%, #101215 52%, #2c3036 100%);
  box-shadow: var(--shadow-lg),
              inset 0 0 0 1.5px rgba(255,255,255,.14),
              inset 0 0 0 9px #0a0b0d;
  display: flex; flex-direction: column;
}
/* side buttons, because their absence is what makes a phone frame look like a box */
.phone::before, .phone::after {
  content: ""; position: absolute; width: 3px; border-radius: 3px;
  background: linear-gradient(180deg, #3d4147, #23262b);
}
.phone::before { left: -3px; top: 132px; height: 58px;
  box-shadow: 0 -74px 0 #2c3036, 0 -122px 0 0 #2c3036; }
.phone::after  { right: -3px; top: 158px; height: 86px; }

.screen { position: relative; flex: 1; border-radius: 44px; overflow: hidden;
          display: flex; flex-direction: column; min-height: 0; background: var(--wa-bg); }

/* --- dynamic island */
.island { position: absolute; top: 9px; left: 50%; transform: translateX(-50%);
          width: 108px; height: 30px; border-radius: 100px; background: #000;
          z-index: 5; box-shadow: inset 0 0 0 .5px rgba(255,255,255,.05); }
.island::after { content: ""; position: absolute; right: 12px; top: 10px;
                 width: 9px; height: 9px; border-radius: 50%;
                 background: radial-gradient(circle at 35% 35%, #2b3a4a, #0a0d12 70%); }

/* --- home indicator */
.homebar { position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%);
           width: 134px; height: 5px; border-radius: 100px; z-index: 5;
           background: var(--wa-header-tx); opacity: .32; }

/* --- ios status bar; small thing, big realism payoff */
.statusbar { display: flex; align-items: center; padding: 15px 26px 6px;
             background: var(--wa-header); color: var(--wa-header-tx);
             font-size: 13px; font-weight: 650; letter-spacing: .01em; }
.statusbar .t { flex: 1; padding-left: 6px; }
.statusbar .icons { display: flex; align-items: center; gap: 5px; opacity: .9;
                    padding-right: 4px; }
.bat { width: 20px; height: 10px; border: 1.2px solid currentColor; border-radius: 3px;
       position: relative; }
.bat::after { content: ""; position: absolute; inset: 1.5px; right: 5px;
              background: currentColor; border-radius: 1px; }
.bat::before { content: ""; position: absolute; right: -3px; top: 3px; width: 1.6px;
               height: 4px; background: currentColor; border-radius: 0 1px 1px 0; }

/* --- whatsapp header: shows WHO YOU ARE TALKING TO, never your own number */
.wahead { display: flex; align-items: center; gap: 9px; padding: 6px 12px 9px;
          background: var(--wa-header); color: var(--wa-header-tx); }
.back { font-size: 19px; opacity: .8; line-height: 1; margin-right: -2px; }
.wavatar { width: 37px; height: 37px; border-radius: 50%; flex-shrink: 0;
           background: linear-gradient(145deg, var(--brand-2), var(--brand));
           color: #fff; display: grid; place-items: center;
           font-size: 13px; font-weight: 800; letter-spacing: -.04em; }
.waname { flex: 1; min-width: 0; }
.waname b { display: block; font-size: 15px; font-weight: 600; line-height: 1.25;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.waname small { font-size: 11.5px; color: var(--wa-meta); }
.waicons { display: flex; gap: 15px; font-size: 16px; opacity: .72; }

/* --- message area */
.msgs { flex: 1; overflow-y: auto; padding: 8px 8px 10px; min-height: 0;
        background-color: var(--wa-bg);
        background-image: var(--wa-pattern);
        background-size: 260px 260px; }


.sysline { text-align: center; margin: 9px 14px; }
.sysline span { display: inline-block; padding: 5px 11px; border-radius: 7px;
  background: var(--wa-sys); color: var(--wa-sys-tx); font-size: 11px; line-height: 1.45; }
.sysline.day span { background: var(--wa-day); color: var(--wa-meta);
  font-weight: 620; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }

.msg { display: flex; margin-bottom: 3px; padding: 0 4px; animation: pop .2s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(5px); } }
.msg.out { justify-content: flex-end; }
.msg + .msg.out:not(.same), .msg + .msg.in:not(.same) { margin-top: 8px; }

.bub { position: relative; max-width: 78%; padding: 6px 9px 4px 9px; border-radius: 8px;
       font-size: 14.2px; line-height: 1.42; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
.msg.in  .bub { background: var(--wa-in);  border-top-left-radius: 2px; }
.msg.out .bub { background: var(--wa-out); border-top-right-radius: 2px; }
.msg.same .bub { border-radius: 8px !important; }
/* the little tail */
.msg:not(.same) .bub::before { content: ""; position: absolute; top: 0; width: 9px; height: 11px; }
.msg.in:not(.same)  .bub::before { left: -8px;
  background: radial-gradient(circle at 100% 0, transparent 9px, var(--wa-in) 9px); }
.msg.out:not(.same) .bub::before { right: -8px;
  background: radial-gradient(circle at 0 0, transparent 9px, var(--wa-out) 9px); }

.txt { white-space: pre-wrap; word-wrap: break-word; }
.txt[dir=rtl] { text-align: right; }
.meta { float: right; margin: 6px 0 -2px 8px; font-size: 10.5px; color: var(--wa-meta);
        display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.tick { color: var(--wa-tick); font-size: 12px; line-height: 1; }

.staff-tag { display: block; font-size: 11.5px; font-weight: 700; color: var(--accent);
             margin-bottom: 1px; }

.typing { display: inline-flex; gap: 3px; padding: 4px 2px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--wa-meta);
            animation: blink 1.25s infinite; }
.typing i:nth-child(2) { animation-delay: .17s; }
.typing i:nth-child(3) { animation-delay: .34s; }
@keyframes blink { 0%,60%,100% { opacity: .25 } 30% { opacity: 1 } }

/* --- interactive reply buttons.
   These are a genuine WhatsApp Business API feature (max 3), and WhatsApp renders
   them ATTACHED BELOW the message as full-width rows with dividers, not as chips
   floating above the composer. Rendering them the real way keeps the channel
   honest while keeping "a person is one tap away" visible from message one. */
.replies { max-width: 78%; margin: 2px 4px 8px; display: flex; flex-direction: column;
           border-radius: 8px; overflow: hidden; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
.chip { background: var(--wa-in); color: var(--wa-btn); border: none;
        padding: 11px 10px; font-size: 13.8px; font-weight: 550; text-align: center;
        border-bottom: 1px solid var(--wa-btn-line); }
.chip:last-child { border-bottom: none; }
.chip:hover { filter: brightness(.96); }
.chip .ic { opacity: .85; margin-right: 5px; }

/* --- composer */
.composer { display: flex; align-items: flex-end; gap: 7px; padding: 7px 8px 9px;
            background: var(--wa-composer); }
.phone .composer { padding-bottom: 20px; }
.cbox { flex: 1; display: flex; align-items: flex-end; gap: 7px; background: var(--wa-in);
        border-radius: 22px; padding: 7px 11px; }
.cbox .ic { font-size: 16px; opacity: .55; line-height: 1.4; }
.cbox textarea { flex: 1; border: none; outline: none; resize: none; background: transparent;
                 color: var(--text); font-size: 14.5px; line-height: 1.4; max-height: 84px; }
.mic { width: 40px; height: 40px; border-radius: 50%; border: none; flex-shrink: 0;
       background: var(--wa-header-tx); color: var(--wa-header); font-size: 16px;
       display: grid; place-items: center; }
.mic:disabled { opacity: .45; }

/* ============================================================ web channel frame */
.browser { width: min(580px, 100%); flex: 0 0 auto; height: min(786px, calc(100vh - 32px));
           border-radius: 16px; border: 1px solid var(--line); overflow: hidden;
           background: var(--surface); box-shadow: var(--shadow-lg);
           display: flex; flex-direction: column; }
.urlbar { display: flex; align-items: center; gap: 10px; padding: 10px 13px;
          background: var(--surface-2); border-bottom: 1px solid var(--line); }
.dots { display: flex; gap: 6px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line-strong); }
.urlbar .u { flex: 1; font-size: 11.5px; color: var(--text-faint); background: var(--surface);
             border: 1px solid var(--line); padding: 5px 11px; border-radius: 100px;
             display: flex; align-items: center; gap: 6px; }

/* 7X lead with black, white, and the blue as a signal. The header follows that:
   black ground, white mark, and the gradient edge as the only colour. */
.webhead { background: #000; color: #fff; padding: 20px 22px 18px; }
.webhead .m { font-size: 25px; font-weight: 800; letter-spacing: -.07em; line-height: 1;
              font-style: italic; }
.webhead .t { font-size: 12.5px; opacity: .62; margin-top: 7px; letter-spacing: .02em;
              text-transform: uppercase; font-weight: 600; }
.webhead .h { font-size: 21px; font-weight: 800; text-transform: uppercase;
              letter-spacing: -.025em; line-height: 1.05; margin-top: 14px; }
.webhead .h em { font-style: normal; color: var(--brand-2); }
.webedge { height: 4px; }
.browser .msgs { background: var(--surface-2); background-image: none; }
.browser .msg.in .bub { background: var(--surface); border: 1px solid var(--line); }
.browser .msg.out .bub { background: var(--brand); color: #fff; }
.browser .msg.out .meta { color: rgba(255,255,255,.7); }
.browser .quick { background: var(--surface-2); }
.browser .chip { background: var(--surface); border: 1px solid var(--line); }
.browser .composer { background: var(--surface); border-top: 1px solid var(--line); }
.browser .cbox { background: var(--surface-2); border: 1px solid var(--line); }
.browser .mic { background: var(--brand); color: #fff; }

/* ============================================================ live record panel */
.record { width: 316px; flex: 0 0 316px; background: var(--surface);
          border: 1px solid var(--line); border-radius: 16px;
          box-shadow: var(--shadow); overflow: hidden; }
@media (max-width: 1200px) { .record { display: none; } }

.rec-head { padding: 14px 16px 13px; border-bottom: 1px solid var(--line); }
.rec-head .lab { font-size: 10px; font-weight: 750; letter-spacing: .1em;
                 text-transform: uppercase; color: var(--text-faint); display: block;
                 margin-bottom: 5px; }
.rec-head h3 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.02em; }

.rec-id { padding: 15px 16px 13px; border-bottom: 1px solid var(--line);
          display: flex; align-items: center; gap: 9px; }
.rec-id .tn { font-family: var(--mono); font-size: 15px; font-weight: 640;
              letter-spacing: -.03em; flex: 1; }

.rec-body { padding: 4px 16px 0; }
.row { display: flex; align-items: baseline; gap: 12px; padding: 9px 0;
       border-bottom: 1px solid var(--line); font-size: 13px; }
.row:last-child { border-bottom: none; }
.row dt { flex: 0 0 76px; font-size: 10.5px; font-weight: 700; letter-spacing: .07em;
          text-transform: uppercase; color: var(--text-faint); }
.row dd { margin: 0; flex: 1; font-weight: 550; line-height: 1.45; word-break: break-word;
          text-align: right; }
.row.stack { display: block; }
.row.stack dt { margin-bottom: 4px; }
.row.stack dd { text-align: left; }
.row dd.changed { animation: flash 1.9s ease-out; border-radius: 5px; }
@keyframes flash {
  0%, 26% { background: var(--ok-bg); box-shadow: 0 0 0 5px var(--ok-bg); color: var(--ok); }
  100%    { background: transparent; box-shadow: none; }
}
.row dd.muted { color: var(--text-faint); font-weight: 450; }
.amount { font-family: var(--mono); font-size: 13px; letter-spacing: -.02em; }

.rec-flags { padding: 12px 16px; border-top: 1px solid var(--line);
             display: flex; flex-wrap: wrap; gap: 6px; }
.rec-foot { padding: 11px 16px 14px; border-top: 1px solid var(--line);
            font-size: 10.5px; color: var(--text-faint); line-height: 1.65; }
.rec-foot .live { display: flex; align-items: center; gap: 6px; margin-bottom: 5px;
                  font-weight: 620; color: var(--text-soft); }
.rec-foot .live i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok);
                    box-shadow: 0 0 0 3px var(--ok-bg); }
.rec-empty { padding: 34px 20px; text-align: center; color: var(--text-faint);
             font-size: 12.5px; line-height: 1.7; }
.rec-empty .big { font-size: 22px; opacity: .3; display: block; margin-bottom: 10px; }

/* ============================================================ verify (web) */
.verify { padding: 22px 20px; flex: 1; overflow-y: auto; background: var(--surface-2); }
.verify h3 { font-size: 16px; font-weight: 650; margin: 0 0 6px; letter-spacing: -.01em; }
.verify p { font-size: 13px; color: var(--text-soft); line-height: 1.6; margin: 0 0 14px; }
.field { display: flex; gap: 7px; margin-bottom: 12px; }
.field input { flex: 1; padding: 10px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--text);
  font-family: var(--mono); letter-spacing: .05em; outline: none; }
.field input:focus { border-color: var(--brand); }
.steps { display: flex; gap: 5px; margin-bottom: 18px; }
.steps i { height: 3px; flex: 1; border-radius: 2px; background: var(--line); }
.steps i.on { background: var(--brand); }
.err { color: var(--blocked); font-size: 12.5px; margin: -6px 0 12px; }

/* ============================================================ modal
   The scenario picker (A-16). Two decisions in order: which channel, then who.
   The step count is the whole argument for the channel, so it is set as a
   figure, the way the console's band sets its figures, and the bars under it
   are the same bars the website's verify pane will then show.                */
/* Anchored to the top, not centred: the two panes differ in height, and a
   dialog that re-centres itself every time the channel changes looks broken. */
.scrim { position: fixed; inset: 0; background: rgba(6,10,16,.42); backdrop-filter: blur(3px);
         display: grid; place-items: start center; padding: 6vh 20px 20px; z-index: 50;
         animation: pop .15s; }
.modal { background: var(--surface); border-radius: 18px; width: 100%; max-width: 540px;
         box-shadow: var(--shadow-lg); overflow: hidden; max-height: 88vh;
         display: flex; flex-direction: column; border: 1px solid var(--line); }
.modal header { padding: 22px 24px 14px; }
.modal header h3 { margin: 0 0 5px; font-family: var(--font-display); font-size: 24px;
                   font-weight: 700; letter-spacing: -.025em; line-height: 1.1; }
.modal header p { margin: 0; font-size: 13.5px; color: var(--text-soft); line-height: 1.5; }
.modal .body { padding: 6px 24px 24px; overflow-y: auto; }

/* --- channel: two cards, one pressed. aria-pressed is the only state; the
       style reads it, so the mark cannot drift from the choice. */
.chan { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.chan button { position: relative; padding: 14px 16px; text-align: left; color: var(--text);
               border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface);
               transition: border-color .12s, background .12s; }
.chan button:hover { border-color: var(--line-strong); }
.chan button[aria-pressed=true] { border-color: var(--brand); background: var(--brand-soft); }
.chan .cname { display: block; font-size: 13.5px; font-weight: 700; letter-spacing: -.015em; }
.chan .cdesc { display: block; font-size: 12.5px; color: var(--text-soft); line-height: 1.45;
               margin-top: 2px; min-height: 2.9em; }  /* two lines, so the figures sit level */
.chan .cfig { display: flex; align-items: baseline; gap: 6px; margin-top: 12px; }
.chan .cfig b { font-family: var(--font-display); font-size: 24px; font-weight: 800;
                letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.chan .cfig.ok b { color: var(--ok); }
.chan .cfig span { font-size: 11.5px; font-weight: 550; color: var(--text-faint); }
.chan .cbars { display: flex; gap: 4px; margin-top: 9px; }
.chan .cbars i { height: 3px; flex: 1; border-radius: 2px; background: var(--line-strong); }
.chan .cbars i.z { background: var(--ok); }
@media (max-width: 440px) { .chan { grid-template-columns: 1fr; } .chan .cdesc { min-height: 0; } }

.pane-lead { font-size: 13.5px; color: var(--text-soft); margin: 0 0 12px; line-height: 1.5; }

/* --- who is messaging. The rule down the left is the verdict this person will
       meet, in the console's colours: green it acts, clay it refuses, gold it
       hands off. Inset from the corners so the radius cannot bend it. */
.persona { position: relative; display: flex; align-items: center; gap: 12px; width: 100%;
           text-align: left; padding: 11px 14px 11px 17px; margin-bottom: 6px; border-radius: 12px;
           border: 1px solid var(--line); background: var(--surface); color: var(--text);
           transition: border-color .12s, background .12s; }
.persona:hover { border-color: var(--brand); background: var(--surface-2); }
.persona::before { content: ""; position: absolute; left: 0; top: 11px; bottom: 11px; width: 3px;
                   border-radius: 0 3px 3px 0; background: var(--line-strong); }
.persona.v-allowed::before { background: var(--ok); }
.persona.v-refused::before { background: var(--blocked); }
.persona.v-unclear::before { background: var(--suspect); }
.persona .pmid { flex: 1; min-width: 0; }
.persona b { display: block; font-size: 13.5px; font-weight: 650; letter-spacing: -.015em; }
.persona .tag { display: block; font-size: 12.5px; color: var(--text-soft); margin-top: 2px; }
.persona .ids { display: flex; gap: 12px; margin-top: 4px; font-size: 11.5px; color: var(--text-faint);
                font-family: var(--mono); letter-spacing: -.02em; }

/* --- the website's four steps, the same four the verify pane walks through */
.flow { list-style: none; margin: 0 0 16px; padding: 0; counter-reset: step; }
.flow li { display: grid; grid-template-columns: 20px 1fr; gap: 0 10px; padding: 9px 0;
           border-top: 1px solid var(--line); counter-increment: step; }
.flow li:first-child { border-top: 0; padding-top: 2px; }
.flow li::before { content: counter(step); font-size: 12.5px; font-weight: 650; padding-top: 1px;
                   color: var(--text-faint); font-variant-numeric: tabular-nums; }
.flow b { display: block; font-size: 13.5px; font-weight: 620; letter-spacing: -.01em; }
.flow span { display: block; font-size: 12.5px; color: var(--text-soft); line-height: 1.45;
             margin-top: 1px; }
.try { font-size: 12.5px; color: var(--text-soft); margin: 0 0 14px; line-height: 1.5; }
.try .mono { color: var(--text); font-weight: 600; }
.modal .wide { width: 100%; padding: 11px; font-weight: 600; }

</style>
</head>
<body>

<aside>
  <div class="side-top">
    <a class="brand-row" href="/" aria-label="7X delivery assistant"><span class="mark"><svg viewBox="0 0 60 32" fill="currentColor" aria-hidden="true"><g transform="skewX(-11)"><polygon points="2,0 28,0 16,32 7,32 18,7 2,7"/><polygon points="32,0 40,0 56,32 48,32"/><polygon points="48,0 56,0 40,32 32,32"/></g></svg></span><span class="bar"></span><span class="sub">Assistant</span></a>
    <button class="btn btn-primary" onclick="openNew()"><span>+</span>New conversation</button>
  </div>
  <div class="sec"><span>Conversations</span><b id="ncount"></b></div>
  <div class="sessions" id="sessions"></div>
  <div class="side-foot">
    <a class="navitem" href="/ops"><span class="g">▤</span>Operations console<span class="k">→</span></a>
    <button class="navitem" onclick="resetAll()"><span class="g">↺</span>Reset the demo</button>
    <div class="clock" id="clock"></div>
  </div>
</aside>

<main id="stage"></main>

<script>
const $ = s => document.querySelector(s);
let sessions = [], current = null, sending = false, lastRecord = null;

/* Direction is left to the browser. `dir="auto"` uses the FIRST strong character, which is
   the Unicode algorithm; the helper this replaced flipped a whole line to RTL if it contained
   a single Arabic character, so an English sentence quoting an address with an Arabic district
   rendered scrambled, and about a third of the addresses in the file have one. */
const esc  = t => (t || "").replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
const hhmm = at => { const d = at ? new Date(at) : new Date();
  return isNaN(d) ? "" : d.toTimeString().slice(0, 5); };

const api = async (p, o) => {
  const r = await fetch(p, { headers: { "Content-Type": "application/json" }, ...o });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
};

/* ------------------------------------------------------------ sidebar */
async function loadSessions() {
  sessions = await api("/api/sessions");
  $("#ncount").textContent = sessions.length || "";
  $("#sessions").innerHTML = sessions.map(s => {
    const name = s.customer_name || "Not verified";
    return `<div class="sess ${current===s.id?"on":""}" onclick="openSession('${s.id}')">${avatar(name, s.customer_name)}<div class="sess-mid"><div class="sess-name">${esc(name)}</div><div class="sess-prev">${esc(s.preview)||"&nbsp;"}</div></div><div class="sess-right"><span class="ch ch-${s.channel}">${s.channel==="whatsapp"?"WA":"WEB"}</span>${s.open_cases?`<span class="badge-case">${s.open_cases}</span>`:""}</div></div>`;
  }).join("")
    || `<div class="sess-empty">No conversations yet.<br>Start one to see it here.</div>`;
}

/* Initials on a colour derived from the name, so the list reads at a glance
   instead of being a wall of identical rows. */
const TONES = 6;
function toneOf(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % TONES; }
function avatar(name, real) {
  if (!real) return `<div class="av none">?</div>`;
  const parts = name.trim().split(/\s+/);
  const ini = ((parts[0]||"")[0] + (parts[1]||"")[0] || "?").toUpperCase();
  return `<div class="av t${toneOf(name)}">${esc(ini)}</div>`;
}

/* ------------------------------------------------------------ new chat
   The scenario picker (A-16): channel first, then who. The pressed card and the
   pane beneath it are both repainted from `pickedChannel`, so they cannot
   disagree. It remembers the last channel across opens.                      */
let pickedChannel = "whatsapp";
const OUTCOME_CLASS = { allowed: "v-allowed", refused: "v-refused", unclear: "v-unclear" };

async function openNew() {
  const demo = await api("/api/demo/customers");
  const people = demo.people, web = demo.web || [];
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="nc-title">
    <header><h3 id="nc-title">New conversation</h3><p>The channel decides how the customer proves who they are. Same assistant, same rules, behind both.</p></header>
    <div class="body"><div class="chan" role="group" aria-label="Channel">
      <button type="button" data-c="whatsapp"><span class="cname">WhatsApp</span><span class="cdesc">The SIM already proved the number.</span><div class="cfig ok"><b>0</b><span>steps to verify</span></div><div class="cbars"><i class="z"></i></div></button>
      <button type="button" data-c="web"><span class="cname">Website</span><span class="cdesc">Knows nothing. Has to ask.</span><div class="cfig"><b>4</b><span>steps to verify</span></div><div class="cbars"><i></i><i></i><i></i><i></i></div></button>
    </div><div id="pane"></div></div></div>`;
  document.body.appendChild(scrim);

  const onKey = e => { if (e.key === "Escape") close(); };
  const close = () => { scrim.remove(); document.removeEventListener("keydown", onKey); };
  document.addEventListener("keydown", onKey);
  scrim.onclick = e => { if (e.target === scrim) close(); };

  const cards = scrim.querySelectorAll(".chan button");
  const pane = scrim.querySelector("#pane");
  const paint = () => {
    cards.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.c === pickedChannel)));
    pane.innerHTML = pickedChannel === "whatsapp"
      ? `<p class="pane-lead">Pick who is messaging. Each is a <b>real row from the cleaned file</b>, chosen because it exercises a different part of the system.</p>`
        + people.map((p, i) => {
            const name = p.customer_name || "No name on file";
            const ids = `<span>${esc(p.tracking_number)}</span>` + (p.masked_phone ? `<span>${esc(p.masked_phone)}</span>` : "");
            return `<button type="button" class="persona ${OUTCOME_CLASS[p.outcome] || ""}" data-i="${i}">${avatar(name, p.customer_name)}<div class="pmid"><b>${esc(name)}</b><span class="tag">${esc(p.label)}</span><span class="ids">${ids}</span></div></button>`;
          }).join("")
      : `<p class="pane-lead">The website knows nothing about who you are, so it has to ask.</p>
         <ol class="flow">
           <li><div><b>Tracking number</b><span>From the parcel or the delivery message.</span></div></li>
           <li><div><b>Record found</b><span>The phone number comes from the file, not from the visitor.</span></div></li>
           <li><div><b>Code sent</b><span>To that number, never to one typed in. The demo shows it on screen; no SMS goes out.</span></div></li>
           <li><div><b>Code confirmed</b><span>The chat opens, verified.</span></div></li>
         </ol>
         <p class="try">Try ${web.map(w => `<span class="mono">${esc(w.tracking)}</span> (${esc(w.why)})`).join(" or ")}.</p>
         <button type="button" class="btn btn-primary wide" id="startweb">Start on the website</button>`;

    pane.querySelectorAll(".persona").forEach(b => b.onclick = async () => {
      const p = people[+b.dataset.i]; close();
      const s = await api("/api/sessions", { method: "POST", body: JSON.stringify({ channel: "whatsapp", phone: p.phone }) });
      await loadSessions(); openSession(s.id);
    });
    const sw = pane.querySelector("#startweb");
    if (sw) sw.onclick = async () => {
      close();
      const s = await api("/api/sessions", { method: "POST", body: JSON.stringify({ channel: "web" }) });
      await loadSessions(); openSession(s.id);
    };
  };
  cards.forEach(b => b.onclick = () => { pickedChannel = b.dataset.c; paint(); });
  paint();
  scrim.querySelector(".chan button[aria-pressed=true]").focus();
}

/* ------------------------------------------------------------ render */
async function openSession(id) {
  if (id !== current) lastRecord = null;
  current = id;
  render(await api("/api/sessions/" + id));
  loadSessions();
}

function render(d) {
  const s = d.session, wa = s.channel === "whatsapp";
  const needsVerify = s.channel === "web" && !s.verified;
  $("#stage").innerHTML = (wa ? phoneFrame(s, d, needsVerify) : browserFrame(s, d, needsVerify))
                        + recordPanel(d.shipment, s);
  if (needsVerify) wireVerify(s.id); else { wireChat(); scrollDown(); }
  lastRecord = d.shipment;
}

function phoneFrame(s, d, needsVerify) {
  return `<div class="phone"><div class="screen"><div class="island"></div><div class="homebar"></div>
    <div class="statusbar"><span class="t">${hhmm()}</span>
      <span class="icons">▪▪▪ <span style="letter-spacing:-1px">◗</span> <span class="bat"></span></span></div>
    <div class="wahead">
      <span class="back">‹</span>
      <div class="wavatar">7X</div>
      <div class="waname"><b>7X</b><small id="presence">business account</small></div>
      <div class="waicons"><span>⤻</span><span>✆</span><span>⋮</span></div>
    </div>
    ${needsVerify ? verifyPane() : body(d)}
  </div></div>`;
}

function browserFrame(s, d, needsVerify) {
  return `<div class="browser">
    <div class="urlbar"><div class="dots"><i></i><i></i><i></i></div>
      <div class="u"><span style="font-size:10px">🔒</span> 7x.ae/track</div></div>
    <div class="webhead">
      <div class="m">7X</div>
      <div class="t">${s.verified ? "Verified · " + esc(s.masked_phone) : "Trade · Transport · Logistics"}</div>
      <div class="h">Track your<br>shipment<em>.</em></div>
    </div>
    <div class="webedge gradient-edge"></div>
    ${needsVerify ? verifyPane() : body(d)}
  </div>`;
}

function body(d) {
  return `<div class="msgs" id="msgs">${thread(d.messages, d.shipment)}</div>
    <div class="composer">
      <div class="cbox"><span class="ic">☺</span>
        <textarea id="input" rows="1" placeholder="Message"></textarea>
        <span class="ic">🖇</span><span class="ic">⌾</span></div>
      <button class="mic" id="send">➤</button>
    </div>`;
}

/* ------------------------------------------------------------ messages */
function thread(ms, sh) {
  let html = `<div class="sysline"><span>🔒 Messages are end-to-end encrypted. This is a simulated channel for a prototype.</span></div>`;
  html += `<div class="sysline day"><span>Today</span></div>`;
  let prev = null;
  for (const m of ms) {
    if (m.role === "notice") { html += `<div class="sysline"><span>${esc(m.text)}</span></div>`; prev = null; continue; }
    html += bubble(m, prev && prev.role === m.role);
    prev = m;
  }
  // WhatsApp attaches reply buttons to the message, so they belong in the thread.
  html += replies(sh);
  return html;
}

/* The three reply buttons the channel allows, chosen from what THIS record permits.
   A button that ends in a refusal is a broken button: tap it on a parcel already at the
   attempt limit and nothing happens but an apology, and after two of those a customer stops
   reading the buttons and calls instead -- which is the single largest complaint in the
   review research (22% of negative reviews) reproduced by the interface meant to prevent it.
   The gate already knows, so the buttons ask it.

   "Talk to a person" is never dropped, whatever state the parcel is in. */
function replies(sh) {
  const out = [];
  if (sh && sh.can_reschedule)     out.push(["🗓", "Change the date", "I need to change the delivery date"]);
  if (sh && sh.can_change_address) out.push(["📍", "Change the address", "I need to change the delivery address"]);
  // Nothing can be done to this parcel, so the only honest offer is to look and to ask.
  if (!out.length)                 out.push(["◎", "Where is it?", "Where is my parcel?"]);
  out.push(["☏", "Talk to a person", "I'd like to speak to a person please"]);
  return `<div class="replies">${out.map(([ic, label, q]) =>
    `<button class="chip" data-q="${esc(q)}"><span class="ic">${ic}</span>${esc(label)}</button>`).join("")}</div>`;
}

function bubble(m, same) {
  const out = m.role === "customer";
  // NOTE: no line breaks inside .txt -- it is `white-space: pre-wrap`, and a prettily
  // indented template literal leaks its indentation into every single message.
  const tag = m.role === "staff" ? `<span class="staff-tag">${esc(m.author || "7X team")}</span>` : "";
  const tick = out ? `<span class="tick">✓✓</span>` : "";
  return `<div class="msg ${out ? "out" : "in"} ${same ? "same" : ""}"><div class="bub">${tag}<span class="txt" dir="auto">${esc(m.text)}</span><span class="meta">${hhmm(m.at)}${tick}</span></div></div>`;
}

/* ------------------------------------------------------------ live record */
function recordPanel(sh, s) {
  const head = `<div class="rec-head"><span class="lab">Live data</span><h3>The shipment record</h3></div>`;

  if (!sh) return `<div class="record">${head}<div class="rec-empty"><span class="big">▦</span>No parcel in focus.<br>One appears here the moment the assistant looks it up.</div></div>`;

  const chg = k => lastRecord && lastRecord.tracking_number === sh.tracking_number
                && String(lastRecord[k]) !== String(sh[k]) ? "changed" : "";
  const flags = [];
  if (sh.unclear)  flags.push(`<span class="pill pill-suspect">records disagree</span>`);
  if (sh.cod > 0)  flags.push(`<span class="pill pill-blocked">COD · address locked</span>`);
  if (sh.attempts !== null && sh.attempts >= sh.max_attempts)
                   flags.push(`<span class="pill pill-blocked">attempt limit</span>`);
  if (!s.verified) flags.push(`<span class="pill pill-blocked">not verified</span>`);

  const none = v => v ? esc(v) : `<span class="muted">—</span>`;

  return `<div class="record">${head}
    <div class="rec-id"><span class="tn">${esc(sh.tracking_number)}</span>
      ${sh.unclear ? `<span class="pill pill-suspect">unclear</span>`
                   : `<span class="pill pill-quiet ${chg("status")}">${esc(sh.status.replace(/_/g," "))}</span>`}</div>
    <div class="rec-body">
      <div class="row stack"><dt>Going to</dt>
        <dd class="${chg("address")}" dir="auto">${sh.address ? esc(sh.address) : `<span class="muted">no address on file</span>`}</dd></div>
      <div class="row"><dt>Date</dt>
        <dd class="${chg("scheduled_date")} ${sh.scheduled_date ? "" : "muted"}">${sh.scheduled_date ? esc(sh.scheduled_date) : "not scheduled"}</dd></div>
      <div class="row"><dt>Emirate</dt><dd>${none(sh.emirate)}</dd></div>
      <div class="row"><dt>To collect</dt>
        <dd class="${sh.cod > 0 ? "amount" : "muted"}">${sh.cod > 0 ? sh.cod.toFixed(2) + " AED" : "nothing"}</dd></div>
      <div class="row"><dt>Attempts</dt>
        <dd class="${sh.attempts === null ? "muted" : ""}">${sh.attempts === null ? "unknown" : sh.attempts + " of " + sh.max_attempts}</dd></div>
    </div>
    ${flags.length ? `<div class="rec-flags">${flags.join("")}</div>` : ""}
    <div class="rec-foot">
      <div class="live"><i></i>Read from the database, every turn</div>
      Last written ${esc(sh.updated_at || "—")}. If the assistant claims something this panel
      does not show, the panel is right.
    </div></div>`;
}

/* ------------------------------------------------------------ verify */
function verifyPane() {
  return `<div class="verify" id="vp"><div class="steps"><i class="on"></i><i></i><i></i><i></i></div>
    <h3>Track a parcel</h3><p>Enter the tracking number from your parcel or your delivery message.</p>
    <div class="field"><input id="vtn" placeholder="EX400312AE" autocomplete="off">
      <button class="btn btn-primary" id="vgo">Find</button></div><div id="verr"></div></div>`;
}

function wireVerify(sid) {
  const step2 = r => {
    $("#vp").innerHTML = `<div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
      <h3>Confirm it's you</h3>
      <p>A code was sent to the number already on this shipment (<span class="mono">${esc(r.masked_phone)}</span>). It goes to the number on the record, never to one you type, so someone holding the parcel cannot get in.</p>
      <div class="demo-strip" style="margin-bottom:14px">DEMO MODE · no SMS is really sent · your code is ${esc(r.demo_code)}</div>
      <div class="field"><input id="vcode" placeholder="4 digits" maxlength="4" autocomplete="off">
        <button class="btn btn-primary" id="vconfirm">Verify</button></div><div id="verr"></div>`;
    const go = async () => {
      const res = await api(`/api/sessions/${sid}/verify/confirm`, { method: "POST", body: JSON.stringify({ code: $("#vcode").value }) });
      if (!res.verified) { $("#verr").innerHTML = `<div class="err">${esc(res.reason)}</div>`; return; }
      openSession(sid);
    };
    $("#vconfirm").onclick = go;
    $("#vcode").onkeydown = e => { if (e.key === "Enter") go(); };
    $("#vcode").focus();
  };
  const find = async () => {
    const tn = $("#vtn").value.trim(); if (!tn) return;
    try {
      const r = await api(`/api/sessions/${sid}/verify/start`, { method: "POST", body: JSON.stringify({ tracking_number: tn }) });
      if (!r.can_verify) {
        $("#vp").innerHTML = `<div class="steps"><i class="on"></i><i class="on"></i><i></i><i></i></div>
          <h3>We can show you where it is</h3><p>${esc(r.reason)}</p>
          <p>You can still see its status. To change anything, our team can verify you another way.</p>
          <button class="btn btn-primary" style="width:100%" onclick="openSession('${sid}')">See the status</button>`;
        return;
      }
      step2(r);
    } catch (e) { $("#verr").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };
  $("#vgo").onclick = find;
  $("#vtn").onkeydown = e => { if (e.key === "Enter") find(); };
  $("#vtn").focus();
}

/* ------------------------------------------------------------ talking */
function wireChat() {
  const input = $("#input");
  input.oninput = () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 84) + "px"; };
  input.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); say(input.value); } };
  $("#send").onclick = () => say(input.value);
  wireChips();
  input.focus();
}

async function say(text) {
  text = (text || "").trim();
  if (!text || sending) return;
  sending = true;
  $("#input").value = ""; $("#input").style.height = "auto"; $("#send").disabled = true;
  const pres = $("#presence"); if (pres) pres.textContent = "typing…";

  $("#msgs").insertAdjacentHTML("beforeend",
    bubble({ role: "customer", text, at: null }, false) +
    `<div class="msg in" id="typing"><div class="bub"><span class="typing"><i></i><i></i><i></i></span></div></div>`);
  scrollDown();

  try {
    await api(`/api/sessions/${current}/message`, { method: "POST", body: JSON.stringify({ text }) });
    render(await api("/api/sessions/" + current));
  } catch (e) {
    document.getElementById("typing")?.remove();
    $("#msgs").insertAdjacentHTML("beforeend", `<div class="sysline"><span>${esc(e.message)}</span></div>`);
  } finally {
    sending = false; scrollDown(); loadSessions();
  }
}

function wireChips() {
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => say(c.dataset.q));
}

const scrollDown = () => { const m = $("#msgs"); if (m) m.scrollTop = m.scrollHeight; };

/* ------------------------------------------------------------ misc */
async function resetAll() {
  if (!confirm("Reset the demo? This restores the shipment data and clears every conversation.")) return;
  await api("/api/reset", { method: "POST" });
  current = null; lastRecord = null;
  await loadSessions(); showEmpty();
}

function showEmpty() {
  $("#stage").innerHTML = `<div class="empty"><h2>No conversation open</h2>
    <p>Start one and pick a channel. WhatsApp arrives already verified. The website has to ask.</p>
    <button class="btn btn-primary" onclick="openNew()">New conversation</button></div>`;
}

(async () => {
  api("/api/meta").then(m => { $("#clock").textContent = "Demo clock · " + (m.today_label || "—"); })
                  .catch(() => { $("#clock").textContent = "Demo clock · —"; });
  await loadSessions(); showEmpty();
  if (location.hash === "#new") openNew();
})();
</script>
</body>
</html>
