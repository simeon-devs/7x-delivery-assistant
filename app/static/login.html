<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7X delivery assistant</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070a17">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%22-4%20-8%2064%2048%22%3E%3Crect%20x%3D%22-4%22%20y%3D%22-8%22%20width%3D%2264%22%20height%3D%2248%22%20rx%3D%229%22%20fill%3D%22%25231428ff%22%2F%3E%3Cg%20fill%3D%22%2523ffffff%22%3E%3Cg%20transform%3D%22skewX%28-11%29%22%3E%3Cpolygon%20points%3D%222%2C0%2027%2C0%2015%2C32%206%2C32%2017%2C7%202%2C7%22%2F%3E%3Cpolygon%20points%3D%2230%2C0%2038%2C0%2054%2C32%2046%2C32%22%2F%3E%3Cpolygon%20points%3D%2246%2C0%2054%2C0%2038%2C32%2030%2C32%22%2F%3E%3C%2Fg%3E%3C%2Fg%3E%3C%2Fsvg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,600;0,700;0,800;1,800&family=IBM+Plex+Sans:wght@400..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400..700&display=swap">
<link rel="stylesheet" href="/static/theme.css">
<style>
/* ============================================================================
   The door.

   Not a login box. The same waybill the landing page floats in the hero, made
   out to this demo instead of to a parcel: ink header strip, dashed rules, a
   perforation, one field where the tracking number would be. The product's own
   object doing the work, so the first screen already speaks the language the
   rest of it speaks (A-27).

   The trails behind it are the landing hero's, unchanged: 7X's line, a world in
   motion. Here they run behind a closed door, which is the whole point.
   ============================================================================ */

/* The trails are wider than the viewport by design; without this the page itself
   scrolls sideways on a phone. body's own overflow does not clip the root. */
html { overflow-x: hidden; }

body {
  display: grid; place-items: center; min-height: 100dvh; margin: 0;
  padding: 24px 16px; position: relative; overflow: hidden; isolation: isolate;
  background:
    radial-gradient(120% 90% at 78% 8%, rgba(20,40,255,.34), transparent 58%),
    radial-gradient(90% 70% at 4% 96%, rgba(10,23,184,.3), transparent 62%),
    linear-gradient(168deg, #0a0e1d 0%, #070a17 46%, #05070f 100%);
  color: #fff;
}

.trails { position: absolute; inset: 0; z-index: 0; pointer-events: none;
          -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
          mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); }
.trail { position: absolute; left: -32%; height: 1.5px; border-radius: 2px;
         background: linear-gradient(90deg, transparent, var(--c), transparent);
         animation: streak var(--d) linear infinite var(--delay); }
@keyframes streak { from { transform: translateX(0); } to { transform: translateX(420%); } }

.mesh { position: absolute; inset: 0; z-index: 0; opacity: .5;
  background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
  background-size: 64px 64px;
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 20%, #000, transparent 75%);
  mask-image: radial-gradient(ellipse 80% 60% at 50% 20%, #000, transparent 75%); }

@media (prefers-reduced-motion: reduce) { .trail { animation: none; opacity: .25; } }

/* ---------------------------------------------------------------- the card */
.door {
  position: relative; z-index: 1; width: 100%; max-width: 420px;
  background: #fff; color: var(--text); border-radius: 6px;
  box-shadow: 0 40px 90px -30px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.1);
}

.strip { display: flex; align-items: center; gap: 10px; padding: 12px 18px;
         background: #0a0c16; color: #fff; border-radius: 6px 6px 0 0; }
.strip svg { display: block; height: 15px; width: auto; color: #fff; }
.strip .nm { font-family: Archivo, sans-serif; font-weight: 700; font-size: 13px;
             letter-spacing: -.01em; }
.strip .st { margin-left: auto; font-size: 11px; color: rgba(255,255,255,.6); }

.body { padding: 22px 18px 18px; border-bottom: 1px dashed #D8D2C5; }
.body h1 { font-family: Archivo, sans-serif; font-size: 25px; font-weight: 700;
           letter-spacing: -.028em; line-height: 1.12; margin: 0 0 9px;
           text-wrap: balance; }
.body p { font-size: 13px; line-height: 1.5; color: var(--text-soft); margin: 0;
          max-width: 34em; }

.field { padding: 16px 18px 4px; }
.field label { display: block; font-size: 11.5px; font-weight: 650; color: var(--text-faint);
               margin-bottom: 6px; }
.field input {
  width: 100%; box-sizing: border-box; padding: 11px 12px;
  font-family: var(--mono); font-size: 15px; letter-spacing: .04em; color: var(--text);
  background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 5px;
  outline: none; transition: border-color .12s, box-shadow .12s;
}
.field input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.field input::placeholder { color: var(--text-faint); letter-spacing: 0; }

/* The refusal is stated, not apologised for, and it says what to do next. */
.bad { display: flex; gap: 7px; align-items: flex-start; margin: 10px 0 0;
       font-size: 12.5px; line-height: 1.45; color: var(--blocked); }
.bad i { flex-shrink: 0; width: 9px; height: 9px; border-radius: 2px; margin-top: 4px;
         background: var(--blocked); }

.perf { height: 11px; margin-top: 16px; background: #EFEBE2;
        border-top: 1px dashed #D8D2C5; border-bottom: 1px dashed #D8D2C5;
        -webkit-mask-image: radial-gradient(circle at 5.5px 50%, transparent 3.2px, #000 3.4px);
        mask-image: radial-gradient(circle at 5.5px 50%, transparent 3.2px, #000 3.4px);
        -webkit-mask-size: 11px 11px; mask-size: 11px 11px; }

.go { padding: 14px 18px 16px; background: #F6F4EF; border-radius: 0 0 6px 6px; }
.go button {
  width: 100%; padding: 11px 16px; border: none; border-radius: 5px; cursor: pointer;
  font-family: Archivo, sans-serif; font-size: 13.5px; font-weight: 700; letter-spacing: -.005em;
  color: #fff; background: var(--brand); transition: background .12s;
}
.go button:hover { background: var(--brand-deep); }
.go button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

@media (max-width: 420px) {
  .body h1 { font-size: 22px; }
}
</style>
</head>
<body>

<div class="trails" id="trails"></div>
<div class="mesh"></div>

<form class="door" method="post" action="/login">
  <div class="strip">
    <svg viewBox="0 0 56 32" fill="currentColor" aria-hidden="true"><g transform="skewX(-11)">
      <polygon points="2,0 27,0 15,32 6,32 17,7 2,7"/>
      <polygon points="30,0 38,0 54,32 46,32"/>
      <polygon points="46,0 54,0 38,32 30,32"/></g></svg>
    <span class="nm">Delivery assistant</span>
    <span class="st">Restricted</span>
  </div>

  <div class="body">
    <h1>Real records are behind this door</h1>
    <p>The demo runs on 7X's own shipment file — customer names, addresses and balances owed.
       That is why it asks.</p>
  </div>

  <div class="field">
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password"
           autofocus required placeholder="••••••••">
    <!--ERROR-->
  </div>

  <div class="perf"></div>

  <div class="go">
    <button type="submit">Open the demo</button>
  </div>
</form>

<script>
/* The landing hero's trails, same recipe, reseeded each load so the door is never
   the same picture twice. */
(function () {
  const box = document.getElementById("trails");
  const C = ["#2d43ff", "#6f81ff", "#ffffff", "#1428ff", "#a8b4ff"];
  for (let i = 0; i < 26; i++) {
    const t = document.createElement("span");
    t.className = "trail";
    t.style.top = (2 + Math.random() * 96) + "%";
    t.style.width = (10 + Math.random() * 42) + "%";
    t.style.height = (Math.random() > .5 ? 1 : 2) + "px";
    t.style.opacity = (.14 + Math.random() * .6).toFixed(2);
    t.style.setProperty("--c", C[(Math.random() * C.length) | 0]);
    t.style.setProperty("--d", (2.2 + Math.random() * 4.4).toFixed(2) + "s");
    t.style.setProperty("--delay", (-Math.random() * 6).toFixed(2) + "s");
    box.appendChild(t);
  }
})();
</script>
</body>
</html>
